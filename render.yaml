services:
  - type: web
    name: auralms
    env: node
    plan: free
    buildCommand: npm --prefix client install && npm --prefix client run build && npm --prefix server install --omit=dev
    startCommand: node server/src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
